<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SafeTrip Buddy</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #eef2f7; }
    #layout { display: flex; height: 100vh; }

    /* Sidebar */
    #sidebar { width: 260px; background: #134e4a; color: #fff; display: flex; flex-direction: column; }
    #newChatBtn { margin: 12px; padding: 10px; border: 1px solid #fff6; background: transparent; color: #fff; border-radius: 8px; cursor: pointer; font-size: 14px; }
    #newChatBtn:hover { background: #fff2; }
    #sideTitle { padding: 4px 16px; font-size: 12px; opacity: 0.7; }
    #chatList { flex: 1; overflow-y: auto; padding: 4px 8px; }
    .chat-item { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .chat-item:hover { background: #fff1; }
    .chat-item.active { background: #fff3; }
    .chat-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .chat-item button { background: transparent; border: 0; color: #fffa; cursor: pointer; font-size: 14px; }
    .chat-item button:hover { color: #fff; }
    #emptyList { padding: 12px; font-size: 13px; opacity: 0.7; }

    /* Chat area */
    #app { flex: 1; display: flex; flex-direction: column; background: #fff; min-width: 0; }
    header { background: #0f766e; color: #fff; padding: 14px 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    #menuBtn { display: none; background: #fff2; color: #fff; border: 0; padding: 6px 10px; border-radius: 6px; cursor: pointer; }
    #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; line-height: 1.45; }
    .user { align-self: flex-end; background: #0f766e; color: #fff; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: #eef2f7; border-bottom-left-radius: 4px; }
    #chips { padding: 0 16px 8px; display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { border: 1px solid #0f766e; color: #0f766e; background: #fff; border-radius: 16px; padding: 4px 10px; font-size: 13px; cursor: pointer; }
    form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #ddd; }
    input { flex: 1; padding: 11px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
    form button { background: #0f766e; color: #fff; border: 0; padding: 0 18px; border-radius: 8px; cursor: pointer; }
    form button:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Phones: sidebar slides over the chat */
    @media (max-width: 700px) {
      #sidebar { position: fixed; z-index: 10; height: 100vh; left: -270px; transition: left 0.2s; }
      #sidebar.open { left: 0; }
      #menuBtn { display: inline-block; }
    }
  </style>
</head>
<body>
<div id="layout">
  <aside id="sidebar">
    <button id="newChatBtn" type="button">+ New chat</button>
    <div id="sideTitle">Recent chats</div>
    <div id="chatList"></div>
  </aside>

  <div id="app">
    <header>
      <button id="menuBtn" type="button">☰</button>
      🧭 SafeTrip Buddy
    </header>
    <div id="messages"></div>
    <div id="chips">
      <button class="chip" data-q="Plan a 3-day trip with a budget of ₹5000 focused on historical places">3-day ₹5000 itinerary</button>
      <button class="chip" data-q="Is it safe to walk around at night here?">Is it safe at night?</button>
      <button class="chip" data-q="I'm lost, what should I do?">I'm lost</button>
    </div>
    <form id="form">
      <input id="input" placeholder="Ask about places, safety, itinerary..." autocomplete="off" />
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </div>
</div>

<script>
  const GREETING = "Hi! I'm SafeTrip Buddy 👋 Ask me about places, safety or itineraries.";

  // clientId = this browser. chatId = the chat you are in right now.
  const clientId = localStorage.getItem("cid") || crypto.randomUUID();
  localStorage.setItem("cid", clientId);
  let chatId = localStorage.getItem("current_chat") || crypto.randomUUID();
  localStorage.setItem("current_chat", chatId);

  const messages = document.getElementById("messages");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");
  const chatList = document.getElementById("chatList");
  const sidebar = document.getElementById("sidebar");

  let coords = null;
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      p => coords = { latitude: p.coords.latitude, longitude: p.coords.longitude },
      () => {}
    );
  }

  function addMessage(text, who) {
    const div = document.createElement("div");
    div.className = "msg " + who;
    div.textContent = text;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  // ----- Sidebar: list of previous chats -----
  async function refreshChatList() {
    try {
      const res = await fetch("/api/chats/" + clientId);
      const data = await res.json();
      chatList.innerHTML = "";
      if (data.chats.length === 0) {
        const empty = document.createElement("div");
        empty.id = "emptyList";
        empty.textContent = "No saved chats yet. Send a message to start one.";
        chatList.appendChild(empty);
        return;
      }
      data.chats.forEach(c => {
        const item = document.createElement("div");
        item.className = "chat-item" + (c.chat_id === chatId ? " active" : "");

        const title = document.createElement("span");
        title.textContent = c.title;
        item.appendChild(title);

        const del = document.createElement("button");
        del.textContent = "✕";
        del.title = "Delete this chat";
        del.addEventListener("click", async e => {
          e.stopPropagation();
          if (!confirm("Delete this chat?")) return;
          await fetch("/api/chats/" + clientId + "/" + c.chat_id, { method: "DELETE" });
          if (c.chat_id === chatId) startNewChat();
          else refreshChatList();
        });
        item.appendChild(del);

        item.addEventListener("click", () => openChat(c.chat_id));
        chatList.appendChild(item);
      });
    } catch (e) {}
  }

  async function openChat(id) {
    chatId = id;
    localStorage.setItem("current_chat", chatId);
    messages.innerHTML = "";
    try {
      const res = await fetch("/api/history/" + clientId + "/" + chatId);
      const data = await res.json();
      if (data.messages.length > 0) {
        data.messages.forEach(m =>
          addMessage(m.content, m.role === "user" ? "user" : "bot")
        );
      } else {
        addMessage(GREETING, "bot");
      }
    } catch (e) {
      addMessage(GREETING, "bot");
    }
    sidebar.classList.remove("open");
    refreshChatList();
  }

  function startNewChat() {
    chatId = crypto.randomUUID();
    localStorage.setItem("current_chat", chatId);
    messages.innerHTML = "";
    addMessage(GREETING, "bot");
    sidebar.classList.remove("open");
    refreshChatList();
  }

  // ----- Sending messages -----
  let busy = false;

  async function send(text) {
    if (busy) return;
    busy = true;
    sendBtn.disabled = true;

    addMessage(text, "user");
    const bot = addMessage("Typing...", "bot");
    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ client_id: clientId, chat_id: chatId, message: text, ...coords })
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        bot.textContent = "Error: " + (err.detail || res.status);
      } else {
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let got = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          got += decoder.decode(value, { stream: true });
          bot.textContent = got;
          messages.scrollTop = messages.scrollHeight;
        }
        if (!got) bot.textContent = "No reply received. Please try again.";
      }
    } catch (e) {
      bot.textContent = "Could not reach the server.";
    }

    busy = false;
    sendBtn.disabled = false;
    input.focus();
    refreshChatList();
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    send(text);
  });

  document.querySelectorAll(".chip").forEach(c =>
    c.addEventListener("click", () => send(c.dataset.q))
  );

  document.getElementById("newChatBtn").addEventListener("click", startNewChat);
  document.getElementById("menuBtn").addEventListener("click", () =>
    sidebar.classList.toggle("open")
  );

  // On page load: show the current chat and the list of old chats
  openChat(chatId);
</script>
</body>
</html>
